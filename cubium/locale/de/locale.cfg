cubium=○🌐Dieser Mod fügt Cubium hinzu. Ein von Ultracube inspirierter Planet.
          
[space-location-name]
cubium=Cubium

[space-location-description]
cubium=Es war einmal ein Ingenieur, der die Geheimnisse des Ultracube meisterte. In einem Rausch der Kubus-induzierten Verrücktheit schuf er einen zweiten Ultracube. Der zweite Kubus geriet in Resonanz mit dem ersten und schuf diesen Himmelskörper – und einen toten Ingenieur.

