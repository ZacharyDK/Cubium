[item-description]
energized-microcube=Dieses Werkzeug ist nur ein Bruchteil des Ultracubes und kann Kubus-Gelee herstellen.
dormant-microcube=Cube schläft. Faul.
inverted-microcube=Ein rekonstituierter Microcube, der zu mehr Transformationen fähig ist.
inverted-dormant-microcube=Mittagsschlaf ist die beste Zeit.
ultradense-substrate=Aus ultradichter Lava gewonnen und mit Stein kristallisiert, eignet sich dieses Material zur Herstellung von Mikrokuben.
energized-shards=Fragmente eines Mikrokubus.
inverted-shards=Invertierte Mikrokubus-Fragmente, die durch das Zusammenschlagen von Mikrokuben entstehen.
cube-jelly=Transzendentale Materie, die durch die Aktivierung von Mikrokuben entsteht. Kann in nützliche Ressourcen umgewandelt werden. Schmeckt wie Hühnchen. 
inverted-cube-jelly=Transzendentale Materie, die durch die Aktivierung von invertierten Mikrokuben entsteht. Kann zu Schwefel und anderen Ressourcen recycelt werden. MIT VORSICHT ZU BEHANDELN.
destabilized-cube-matter=Weniger stabiles Kubus-Gelee, fast wie ein Traum. Kann zu nützlichen Ressourcen recycelt werden.
dream=Schmeckt wie Zuckerwatte. In Wasser auflösen, um flüssigen Traum herzustellen.
dream-fuel=Fester Brennstoff, getränkt mit Traum. Wende Hoffnung an, um die Sterne zu erreichen.

